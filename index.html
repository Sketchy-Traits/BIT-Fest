<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BIT Fest — Back In Time Festival</title>

<style>
  body {
    background: #101018;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 40px 20px;
  }

  h1 {
    font-size: clamp(42px, 8vw, 90px);
    margin-bottom: 5px;
    color: #ffdb4d;
  }

  .subtitle {
    font-size: 20px;
    color: #aaa;
    margin-bottom: 45px;
  }

  .stage {
    background: #202030;
    border: 2px solid #ffdb4d;
    border-radius: 16px;
    padding: 30px;
    max-width: 650px;
    margin: auto;
  }

  button {
    background: #ffdb4d;
    border: none;
    border-radius: 8px;
    padding: 15px 30px;
    font-size: 20px;
    font-weight: bold;
    cursor: pointer;
  }

  button:hover {
    background: #ffe980;
  }

  #status {
    margin: 20px 0;
    color: #ccc;
  }

  audio {
    width: 100%;
    margin-top: 20px;
  }

  .clock {
    font-size: 22px;
    margin-bottom: 25px;
  }
</style>
</head>

<body>

<h1>BIT FEST</h1>
<div class="subtitle">BACK IN TIME FESTIVAL</div>

<div class="clock" id="clock"></div>

<div class="stage">
  <h2>🎪 MAIN STAGE</h2>
  <p>16 hours of music. Every day. Live in sync.</p>

  <button onclick="playLive()">▶ JOIN MAIN STAGE</button>

  <p id="status">Press JOIN to tune into the festival.</p>

  <audio id="player" controls preload="metadata"></audio>
</div>

<script>

const BASE_URL = "https://pub-36cd4f34933e414481fb1cf9f28e133e.r2.dev/";

const PARTS = [
  { file: "bitfest-mainstage-01.mp3", duration: 3*3600 + 6*60 + 36 },
  { file: "bitfest-mainstage-02.mp3", duration: 3*3600 + 6*60 + 36 },
  { file: "bitfest-mainstage-03.mp3", duration: 3*3600 + 6*60 + 36 },
  { file: "bitfest-mainstage-04.mp3", duration: 6*3600 + 41*60 + 56 }
];

const START_HOUR = 11;
const START_MINUTE = 55;
const TOTAL_DURATION = PARTS.reduce((sum, part) => sum + part.duration, 0);

const player = document.getElementById("player");
const status = document.getElementById("status");
const clock = document.getElementById("clock");

let joined = false;
let currentPart = -1;
let loadingToken = 0;

// Get the current UK time, accounting for daylight saving.
function ukNow() {
  const parts = new Intl.DateTimeFormat("en-GB", {
    timeZone: "Europe/London",
    year: "numeric",
    month: "2-digit",
    day: "2-digit",
    hour: "2-digit",
    minute: "2-digit",
    second: "2-digit",
    hourCycle: "h23"
  }).formatToParts(new Date());

  return Object.fromEntries(parts.map(p => [p.type, Number(p.value)]));
}

// Seconds elapsed since the most recent 11:55 UK start.
function festivalSeconds() {
  const now = ukNow();
  const secondsToday = now.hour*3600 + now.minute*60 + now.second;
  const startSeconds = START_HOUR*3600 + START_MINUTE*60;

  let elapsed = secondsToday - startSeconds;

  if (elapsed < 0) elapsed += 24*3600;

  return elapsed;
}

function findPart(elapsed) {
  let remaining = elapsed;

  for (let i = 0; i < PARTS.length; i++) {
    if (remaining < PARTS[i].duration) {
      return { index: i, offset: remaining };
    }
    remaining -= PARTS[i].duration;
  }

  return null;
}

function formatTime(seconds) {
  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  const s = Math.floor(seconds % 60);

  return [h,m,s].map(n => String(n).padStart(2,"0")).join(":");
}

function updateClock() {
  const now = ukNow();
  clock.textContent =
    `🇬🇧 UK TIME: ${String(now.hour).padStart(2,"0")}:${String(now.minute).padStart(2,"0")}:${String(now.second).padStart(2,"0")}`;

  const elapsed = festivalSeconds();

  if (elapsed >= TOTAL_DURATION) {
    status.textContent = "🌙 Festival closed — returns at 11:55am UK time.";
    if (joined) {
      joined = false;
      player.pause();
      currentPart = -1;
    }
    return;
  }

  if (!joined) {
    status.textContent = `🟢 Festival LIVE — ${formatTime(elapsed)} into today's show.`;
    return;
  }

  const target = findPart(elapsed);
  if (!target) return;

  if (target.index !== currentPart) {
    loadPart(target.index, target.offset);
    return;
  }

  // Keep playback aligned with the festival clock.
  if (player.readyState >= 1 && !player.seeking &&
      Math.abs(player.currentTime - target.offset) > 5) {
    player.currentTime = target.offset;
  }
}

function loadPart(index, offset) {
  const token = ++loadingToken;
  currentPart = index;

  player.pause();
  player.src = BASE_URL + PARTS[index].file;
  player.load();

  status.textContent = `⏳ Loading Main Stage — Part ${index+1}...`;

  player.addEventListener("loadedmetadata", function ready() {
    if (token !== loadingToken) return;

    const elapsed = festivalSeconds();
    const target = findPart(elapsed);

    if (!target || target.index !== index || !joined) return;

    player.currentTime = Math.min(target.offset, Math.max(0, player.duration - 0.5));

    player.play().then(() => {
      status.textContent = `🔴 LIVE — Main Stage | Part ${index+1}`;
    }).catch(() => {
      status.textContent = "Tap play on the audio player to start.";
    });
  }, { once: true });
}

function playLive() {
  const elapsed = festivalSeconds();

  if (elapsed >= TOTAL_DURATION) {
    status.textContent = "🌙 Festival closed — returns at 11:55am UK time.";
    return;
  }

  joined = true;
  const target = findPart(elapsed);

  if (target.index === currentPart && player.readyState >= 1) {
    player.currentTime = target.offset;
    player.play().catch(() => {
      status.textContent = "Tap play on the audio player to start.";
    });
  } else {
    loadPart(target.index, target.offset);
  }
}

player.addEventListener("ended", () => {
  if (joined) updateClock();
});

setInterval(updateClock, 1000);
updateClock();

</script>

</body>
</html>
