<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BIT Fest — Back In Time Festival</title>

<style>
  * { box-sizing: border-box; }

  body {
    background: #101018;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 40px 20px;
    margin: 0;
  }

  h1 {
    font-size: clamp(42px, 8vw, 90px);
    margin: 0 0 5px;
    color: #ffdb4d;
  }

  .subtitle {
    font-size: 20px;
    color: #aaa;
    margin-bottom: 35px;
  }

  .clock {
    font-size: 22px;
    margin-bottom: 25px;
  }

  .stage {
    background: #202030;
    border: 2px solid #ffdb4d;
    border-radius: 16px;
    padding: 30px;
    max-width: 650px;
    margin: auto;
  }

  .live {
    color: #ff5555;
    font-weight: bold;
    letter-spacing: 2px;
  }

  .now-playing {
    background: #151520;
    border-radius: 12px;
    padding: 25px 20px;
    margin: 25px 0;
  }

  .now-playing-label {
    font-size: 13px;
    letter-spacing: 3px;
    color: #aaa;
  }

  #artist {
    font-size: 32px;
    font-weight: bold;
    margin: 14px 0 8px;
    color: #ffdb4d;
  }

  #set-title {
    font-size: 19px;
    margin-bottom: 6px;
  }

  #set-year {
    color: #aaa;
    font-size: 15px;
  }

  #set-time {
    color: #aaa;
    font-size: 14px;
    margin-top: 14px;
  }

  .up-next {
    margin-top: 25px;
    padding-top: 20px;
    border-top: 1px solid #444;
  }

  .up-next-label {
    font-size: 12px;
    letter-spacing: 2px;
    color: #aaa;
  }

  #next-artist {
    font-size: 20px;
    margin-top: 10px;
  }

  #next-time {
    color: #aaa;
    margin-top: 5px;
  }

  button {
    background: #ffdb4d;
    border: none;
    border-radius: 8px;
    padding: 15px 30px;
    font-size: 20px;
    font-weight: bold;
    cursor: pointer;
    min-width: 230px;
  }

  button:hover { background: #ffe980; }
  button:focus-visible { outline: 3px solid white; outline-offset: 4px; }

  #status {
    margin: 20px 0;
    color: #ccc;
    min-height: 22px;
  }

  /* Audio stays functional but has no visible controls. */
  #player { display: none; }

  .schedule {
    color: #aaa;
    font-size: 14px;
    margin-top: 22px;
  }
</style>
</head>

<body>

<h1>BIT FEST</h1>
<div class="subtitle">BACK IN TIME FESTIVAL</div>

<div class="clock" id="clock"></div>

<div class="stage">
  <h2>🎪 MAIN STAGE</h2>
  <p class="live" id="live-indicator">● CHECKING...</p>

  <div class="now-playing">
    <div class="now-playing-label">NOW PLAYING</div>

    <div id="artist">Loading schedule...</div>
    <div id="set-title"></div>
    <div id="set-year"></div>
    <div id="set-time"></div>

    <div class="up-next">
      <div class="up-next-label">UP NEXT</div>
      <div id="next-artist"></div>
      <div id="next-time"></div>
    </div>
  </div>

  <button id="join-button" type="button">▶ JOIN MAIN STAGE</button>

  <p id="status" aria-live="polite">
    Connecting to festival clock...
  </p>

  <audio id="player" preload="none"></audio>

  <div class="schedule">
    Daily: 08:55 – 00:56 UK time
  </div>
</div>

<script>

// ======================================================
// BIT FEST — AUDIO FILES
// ======================================================

const BASE_URL =
  "https://pub-36cd4f34933e414481fb1cf9f28e133e.r2.dev/";

const PARTS = [
  { file: "bitfest-mainstage-01.mp3", duration: 3*3600 + 6*60 + 36 },
  { file: "bitfest-mainstage-02.mp3", duration: 3*3600 + 6*60 + 36 },
  { file: "bitfest-mainstage-03.mp3", duration: 3*3600 + 6*60 + 36 },
  { file: "bitfest-mainstage-04.mp3", duration: 6*3600 + 41*60 + 56 }
];

// ======================================================
// BIT FEST — MAIN STAGE LINEUP
// ======================================================

const LINEUP = [
  { time: "08:55:00", artist: "Sketchy Traits", title: "Dusty Decks", year: 2017 },
  { time: "09:30:00", artist: "JPod", title: "BlissCoast 10", year: 2023 },
  { time: "10:30:00", artist: "A.Skillz", title: "Annie Nightingale Guest Mix", year: 2009 },
  { time: "11:00:00", artist: "Twogood", title: "Glastonbury Live Mix", year: 2017 },
  { time: "12:00:00", artist: "Mista Trick", title: "Dubtendo", year: 2016 },
  { time: "13:00:00", artist: "Featurecast", title: "The Main Event! Promo Mix", year: 2012 },
  { time: "13:30:00", artist: "Spin Kringle", title: "Hello I Am Fruit Salad", year: 2023 },
  { time: "14:30:00", artist: "DJs From Mars", title: "The History of Electronic Dance Music", year: 2017 },
  { time: "14:35:00", artist: "CMC & Silenta", title: "Shambhala Mix", year: 2013 },
  { time: "16:05:00", artist: "Neon Steve", title: "Fractal Forest (Shambhala)", year: 2012 },
  { time: "17:35:00", artist: "Slynk", title: "Fractal Forest (Shambhala)", year: 2013 },
  { time: "19:25:00", artist: "Smalltown DJs", title: "Bass Coast", year: 2017 },
  { time: "21:00:00", artist: "Jack Beats", title: "Night Bass NYE", year: 2015 },
  { time: "22:00:00", artist: "DJ Zinc", title: "Crack House Mix", year: 2012 },
  { time: "23:10:00", artist: "Plump DJs", title: "Bonsai Kat 'Bla Bla Bla Bla' Mix", year: 2022 },
  { time: "23:55:00", artist: "Deekline & Ed Solo", title: "Boomtown Sector 6", year: 2017 }
];

// ======================================================
// FESTIVAL SETTINGS
// ======================================================

const START_SECONDS = 8*3600 + 55*60;
const TOTAL_DURATION = PARTS.reduce((sum, p) => sum + p.duration, 0);

const player = document.getElementById("player");
const status = document.getElementById("status");
const clock = document.getElementById("clock");
const artist = document.getElementById("artist");
const setTitle = document.getElementById("set-title");
const setYear = document.getElementById("set-year");
const setTime = document.getElementById("set-time");
const nextArtist = document.getElementById("next-artist");
const nextTime = document.getElementById("next-time");
const button = document.getElementById("join-button");
const indicator = document.getElementById("live-indicator");

let joined = false;
let currentPart = -1;
let loadToken = 0;
let loading = false;
let lastRecovery = 0;

// ======================================================
// UK CLOCK
// ======================================================

function ukTime() {
  const values = new Intl.DateTimeFormat("en-GB", {
    timeZone: "Europe/London",
    hour: "2-digit",
    minute: "2-digit",
    second: "2-digit",
    hourCycle: "h23"
  }).formatToParts(new Date());

  const t = Object.fromEntries(
    values.filter(x => x.type !== "literal")
          .map(x => [x.type, Number(x.value)])
  );

  return t.hour*3600 + t.minute*60 + t.second;
}

function festivalSeconds() {
  return (ukTime() - START_SECONDS + 86400) % 86400;
}

function findPart(elapsed) {
  let offset = elapsed;

  for (let i = 0; i < PARTS.length; i++) {
    if (offset < PARTS[i].duration) {
      return { index: i, offset };
    }
    offset -= PARTS[i].duration;
  }

  return null;
}

function formatTime(seconds) {
  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  const s = Math.floor(seconds % 60);

  return [h, m, s]
    .map(x => String(x).padStart(2, "0"))
    .join(":");
}

// ======================================================
// NOW PLAYING — DJ SCHEDULE
// ======================================================

const SCHEDULE = LINEUP.map(set => {
  const [h, m, s] = set.time.split(":").map(Number);
  const start = h*3600 + m*60 + s;

  return {
    ...set,
    offset: (start - START_SECONDS + 86400) % 86400
  };
}).sort((a, b) => a.offset - b.offset);

function getCurrentSet(elapsed) {
  if (elapsed >= TOTAL_DURATION) return null;

  let index = -1;

  for (let i = 0; i < SCHEDULE.length; i++) {
    if (elapsed >= SCHEDULE[i].offset) {
      index = i;
    } else {
      break;
    }
  }

  if (index < 0) return null;

  return {
    current: SCHEDULE[index],
    next: SCHEDULE[index + 1] || null,
    endOffset: SCHEDULE[index + 1]?.offset ?? TOTAL_DURATION
  };
}

function updateNowPlaying(elapsed) {
  const set = getCurrentSet(elapsed);

  if (!set) {
    artist.textContent = "Main Stage Closed";
    setTitle.textContent = "";
    setYear.textContent = "";
    setTime.textContent = "Back at 08:55 UK time";
    nextArtist.textContent = "Sketchy Traits";
    nextTime.textContent = "08:55";
    return;
  }

  artist.textContent = set.current.artist;
  setTitle.textContent = set.current.title;
  setYear.textContent = `Original mix: ${set.current.year}`;

  const start = set.current.time.slice(0, 5);
  const end = set.next
    ? set.next.time.slice(0, 5)
    : "00:56";

  setTime.textContent = `${start} – ${end} UK time`;

  if (set.next) {
    nextArtist.textContent = set.next.artist;
    nextTime.textContent =
      `${set.next.time.slice(0, 5)} · ${set.next.title}`;
  } else {
    nextArtist.textContent = "Festival closes at 00:56";
    nextTime.textContent = "Back tomorrow at 08:55";
  }
}

// ======================================================
// LIVE DISPLAY AND SYNCHRONISATION
// ======================================================

function updateDisplay() {
  const now = ukTime();
  clock.textContent = "🇬🇧 UK TIME: " + formatTime(now);

  const elapsed = festivalSeconds();
  const target = findPart(elapsed);

  updateNowPlaying(elapsed);

  if (!target) {
    indicator.textContent = "● OFF AIR";
    indicator.style.color = "#888";

    if (joined) stopListening();

    status.textContent = "🌙 Festival returns at 08:55.";
    return;
  }

  indicator.textContent = "● LIVE NOW";
  indicator.style.color = "#ff5555";

  if (!joined) {
    status.textContent =
      "Press JOIN to tune into the live Main Stage.";
    return;
  }

  if (target.index !== currentPart) {
    loadPart(target.index);
    return;
  }

  // Correct drift after buffering, background tabs or sleep.
  if (!loading && player.readyState >= 1 && !player.seeking) {
    const drift = Math.abs(player.currentTime - target.offset);

    if (drift > 3) {
      player.currentTime = target.offset;
    }
  }

  // Recover playback if interrupted by the browser.
  if (!loading && player.paused &&
      Date.now() - lastRecovery > 5000) {
    lastRecovery = Date.now();

    player.play().catch(() => {
      status.textContent =
        "Playback paused — press JOIN to resume.";
    });
  }
}

function loadPart(index) {
  const token = ++loadToken;
  currentPart = index;
  loading = true;

  player.pause();
  player.src = BASE_URL + PARTS[index].file;
  player.load();

  status.textContent = "⏳ Connecting to Main Stage...";

  function ready() {
    if (token !== loadToken || !joined) return;

    const target = findPart(festivalSeconds());

    if (!target || target.index !== index) {
      loading = false;
      updateDisplay();
      return;
    }

    const safeOffset = Math.min(
      target.offset,
      Math.max(0, player.duration - 0.25)
    );

    player.currentTime = safeOffset;

    const start = () => {
      if (token !== loadToken || !joined) return;

      loading = false;

      player.play().then(() => {
        status.textContent = "🔊 Listening LIVE";
      }).catch(() => {
        status.textContent =
          "Press JOIN to start playback.";
      });
    };

    if (player.seeking) {
      player.addEventListener("seeked", start, { once: true });
    } else {
      start();
    }
  }

  player.addEventListener("loadedmetadata", ready, { once: true });
}

function stopListening() {
  joined = false;
  loadToken++;
  currentPart = -1;
  loading = false;

  player.pause();
  player.removeAttribute("src");
  player.load();

  button.textContent = "▶ JOIN MAIN STAGE";
}

function joinOrLeave() {
  if (joined) {
    stopListening();
    updateDisplay();
    return;
  }

  const target = findPart(festivalSeconds());

  if (!target) {
    status.textContent = "Festival is currently closed.";
    return;
  }

  joined = true;
  button.textContent = "■ LEAVE MAIN STAGE";
  loadPart(target.index);
}

// ======================================================
// EVENT LISTENERS
// ======================================================

setInterval(updateDisplay, 1000);

document.addEventListener("visibilitychange", () => {
  if (!document.hidden) updateDisplay();
});

window.addEventListener("focus", updateDisplay);
window.addEventListener("pageshow", updateDisplay);

player.addEventListener("ended", () => {
  if (joined) updateDisplay();
});

player.addEventListener("error", () => {
  if (joined) {
    loading = false;
    status.textContent =
      "Audio connection interrupted. Press LEAVE, then JOIN to reconnect.";
  }
});

button.addEventListener("click", joinOrLeave);

updateDisplay();

</script>

</body>
</html>
